<!DOCTYPE html>
<html>
<head>
<style>
body {
    background:#111;
    color:white;
    text-align:center;
    padding-top:100px;
    font-family:Arial;
}
.box {
    background:white;
    color:black;
    padding:30px;
    border-radius:12px;
    width:300px;
    margin:auto;
}
</style>
</head>

<body>

<div class="box">
<h2>🔐 Enter Key</h2>

<form method="post">
<input type="password" name="key" placeholder="Enter key">
<button type="submit">Unlock</button>
</form>

{% if error %}
<p style="color:red;">{{error}}</p>
{% endif %}

</div>

</body>
</html>
