
<!DOCTYPE html>
<html>
<head>
    <title>Decode Message</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            text-align: center;
            padding-top: 80px;
        }

        .box {
            background: white;
            color: black;
            padding: 30px;
            border-radius: 12px;
            width: 350px;
            margin: auto;
        }

        input, button {
            margin: 10px;
            padding: 10px;
            width: 90%;
            border-radius: 8px;
            border: none;
        }

        button {
            background: #ff758c;
            color: white;
        }
    </style>
</head>

<body>

<h1>🔓 Decode Secret Message</h1>

<div class="box">
    <form action="/decode" method="post" enctype="multipart/form-data">

        <input type="file" name="file" required>

        <input type="password" name="key" placeholder="Enter secret key" required>

        <button type="submit">Decode</button>
    </form>

    <br>
    <a href="/">Back to Encode</a>

</div>

</body>
</html>
