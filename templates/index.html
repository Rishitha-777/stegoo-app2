<!DOCTYPE html>
<html>
<head>
<title>Stego Premium</title>
<style>
body {
    background: linear-gradient(135deg,#667eea,#764ba2);
    font-family: Arial;
    color:white;
    text-align:center;
    padding-top:80px;
}
.box {
    background:white;
    color:black;
    padding:30px;
    border-radius:12px;
    width:320px;
    margin:auto;
}
input,button {
    width:90%;
    padding:10px;
    margin:10px;
    border-radius:8px;
    border:none;
}
button {
    background:#667eea;
    color:white;
}
</style>
</head>

<body>

<h1>🔐 Secure Messenger</h1>

<div class="box">
<form action="/encode" method="post">
<input type="password" name="message" placeholder="Secret message">
<input type="password" name="key" placeholder="Secret key">
<button type="submit">Generate Secure Link</button>
</form>
</div>

</body>
</html>
